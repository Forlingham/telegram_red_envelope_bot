version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: scash_bot_postgres
    environment:
      POSTGRES_USER: scash_bot
      POSTGRES_PASSWORD: hEM3nGca8X3x3zXx
      POSTGRES_DB: scash_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scash_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
